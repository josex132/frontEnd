<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <meta charset="UTF-8">
    <title>SportStock</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
</head>
<body style="display:flex;flex-direction:column;align-items:center;
             justify-content:center;height:100vh;font-family:Quicksand;">

    <img src="logo.jpg" alt="Logo SportStock" style="width:120px;margin-bottom:10px;">
    <p id="estadoAPI" style="font-size:13px;margin:4px 0 0;font-family:Quicksand;">⏳ Verificando API...</p>
    <h1>SportStock</h1>
    <p style="color:var(--dark-green);font-weight:bold;margin-bottom:20px;">
        Sistema de Gestión de Inventario Deportivo
    </p>

    <!-- Mensaje de estado -->
    <div id="mensaje" style="display:none;padding:10px 20px;border-radius:10px;
        margin-bottom:15px;font-weight:bold;text-align:center;
        width:350px;box-sizing:border-box;"></div>

    <div style="border:2px solid var(--primary-green);padding:40px;
                border-radius:30px;width:350px;">
        <h2>Bienvenido</h2>
        <p style="color:#999;">Ingrese su cuenta o regístrese para comenzar</p>

        <!-- Tabs de modo -->
        <div style="display:flex;background:#dce8d7;border-radius:20px;
                    padding:5px;margin-bottom:25px;">
            <button onclick="mostrarLogin()" id="btnLogin"
                style="flex:1;padding:10px;border:none;border-radius:20px;
                       background:white;font-weight:bold;cursor:pointer;">
                Iniciar Sesión
            </button>
            <button onclick="mostrarRegistro()" id="btnRegistro"
                style="flex:1;padding:10px;border:none;border-radius:20px;
                       background:transparent;font-weight:bold;cursor:pointer;">
                Registrarse
            </button>
        </div>

        <!-- ── FORMULARIO LOGIN ── -->
        <div id="loginForm">
            <label style="font-weight:bold;color:var(--dark-green);">Correo electrónico</label>
            <input id="login-correo" type="email" placeholder="usuario@gmail.com"
                style="width:100%;padding:12px;border:none;border-radius:10px;
                       background:var(--light-green);margin:10px 0 20px;box-sizing:border-box;">

            <label style="font-weight:bold;color:var(--dark-green);">Contraseña</label>
            <input id="login-password" type="password" placeholder="********"
                style="width:100%;padding:12px;border:none;border-radius:10px;
                       background:var(--light-green);margin:10px 0 25px;box-sizing:border-box;">

            <button onclick="iniciarSesion()"
                style="width:100%;padding:15px;border:none;border-radius:15px;
                       background:var(--primary-green);color:black;font-size:18px;
                       cursor:pointer;font-family:Quicksand;">
                Iniciar Sesión
            </button>
        </div>

        <!-- ── FORMULARIO REGISTRO ── -->
        <div id="registroForm" style="display:none;">
            <label style="font-weight:bold;color:var(--dark-green);">Nombre completo</label>
            <input id="reg-nombre" type="text" placeholder="Ingrese su nombre"
                style="width:100%;padding:12px;border:none;border-radius:10px;
                       background:var(--light-green);margin:10px 0 20px;box-sizing:border-box;">

            <label style="font-weight:bold;color:var(--dark-green);">Correo electrónico</label>
            <input id="reg-correo" type="email" placeholder="usuario@gmail.com"
                style="width:100%;padding:12px;border:none;border-radius:10px;
                       background:var(--light-green);margin:10px 0 20px;box-sizing:border-box;">

            <label style="font-weight:bold;color:var(--dark-green);">Contraseña</label>
            <input id="reg-password" type="password" placeholder="********"
                minlength="7" maxlength="12"
                style="width:100%;padding:12px;border:none;border-radius:10px;
                       background:var(--light-green);margin:10px 0 20px;box-sizing:border-box;">

            <label style="font-weight:bold;color:var(--dark-green);">Edad</label>
            <input id="reg-edad" type="number" placeholder="Ej: 25" min="1" max="120"
                style="width:100%;padding:12px;border:none;border-radius:10px;
                       background:var(--light-green);margin:10px 0 25px;box-sizing:border-box;">

            <button onclick="registrarse()"
                style="width:100%;padding:15px;border:none;border-radius:15px;
                       background:var(--primary-green);color:black;font-size:18px;
                       cursor:pointer;font-family:Quicksand;">
                Registrarse
            </button>
        </div>
    </div>

<script>
    // ── Mismo endpoint que el backend Java ──
    const API_BASE     = "http://localhost:8080/api";
    const API_USUARIOS = API_BASE + "/usuarios";
    const API_LOGIN    = API_BASE + "/usuarios/login";

    function mostrarMensaje(texto, tipo) {
        const el = document.getElementById("mensaje");
        el.textContent = texto;
        el.style.display  = "block";
        el.style.background = tipo === "error" ? "#f8d7da" : "#d4edda";
        el.style.color      = tipo === "error" ? "#721c24" : "#155724";
        el.style.border     = tipo === "error" ? "1px solid #f5c6cb" : "1px solid #c3e6cb";
    }

    function mostrarRegistro() {
        document.getElementById("loginForm").style.display    = "none";
        document.getElementById("registroForm").style.display = "block";
        document.getElementById("btnRegistro").style.background = "white";
        document.getElementById("btnLogin").style.background    = "transparent";
        document.getElementById("mensaje").style.display = "none";
    }

    function mostrarLogin() {
        document.getElementById("loginForm").style.display    = "block";
        document.getElementById("registroForm").style.display = "none";
        document.getElementById("btnLogin").style.background    = "white";
        document.getElementById("btnRegistro").style.background = "transparent";
        document.getElementById("mensaje").style.display = "none";
    }

    // ══════════════════════════════════════════
    // REGISTRARSE
    // API recibe: { nombre, correo, edad, rol, estado, contraseña }
    // ══════════════════════════════════════════
    async function registrarse() {
        const nombre   = document.getElementById("reg-nombre").value.trim();
        const correo   = document.getElementById("reg-correo").value.trim();
        const password = document.getElementById("reg-password").value;
        const edadVal  = parseInt(document.getElementById("reg-edad")?.value) || 0;

        if (!nombre || !correo || !password) {
            mostrarMensaje("Por favor completa todos los campos.", "error"); return;
        }
        if (password.length < 7 || password.length > 12) {
            mostrarMensaje("La contraseña debe tener entre 7 y 12 caracteres.", "error"); return;
        }
        if (edadVal < 1 || edadVal > 120) {
            mostrarMensaje("Por favor ingresa una edad válida (1-120).", "error"); return;
        }

        const ahora = new Date();
        const fechaHoraReg = ahora.toLocaleDateString("es-CO") + " " +
            ahora.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });

        // Objeto para la API (campos que acepta el backend Java)
        const payloadAPI = {
            nombre,
            correo,
            edad: edadVal,
            rol: "Empleado",
            estado: true,
            contraseña: password
        };

        let idFinal = Date.now();

        try {
            const res = await fetch(API_USUARIOS, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payloadAPI)
            });
            if (res.ok) {
                const creado = await res.json();
                idFinal = creado.id || idFinal;
            }
            // Si falla simplemente continúa en modo local
        } catch { /* modo offline */ }

        // Guardar sesión
        sessionStorage.setItem("usuarioLogueado", JSON.stringify({
            id: idFinal, nombre, correo, rol: "Empleado", ultimoLogin: fechaHoraReg
        }));

        // Guardar en localStorage para persistencia
        const locales = JSON.parse(localStorage.getItem("usuariosLocales") || "[]");
        if (!locales.some(u => u.correo === correo)) {
            locales.push({
                id: idFinal, nombre, correo, edad: edadVal || "-", rol: "Empleado",
                contraseña: password,
                estado: true, fechaRegistro: ahora.toLocaleDateString("es-CO"),
                ultimoLogin: fechaHoraReg
            });
            localStorage.setItem("usuariosLocales", JSON.stringify(locales));
        }

        mostrarMensaje("¡Registro exitoso! Redirigiendo...", "ok");
        setTimeout(() => window.location.href = "dashboard.html", 1000);
    }

    // ══════════════════════════════════════════
    // INICIAR SESIÓN
    // Usa POST /usuarios/login con { correo, contraseña }
    // Fallback: busca en localStorage si la API no responde
    // ══════════════════════════════════════════
    // Verificar estado de la API al cargar
    async function verificarAPI() {
        const indicador = document.getElementById("estadoAPI");
        try {
            const res = await fetch(API_BASE + "/health", { signal: AbortSignal.timeout(3000) });
            if (res.ok) {
                indicador.textContent = "🟢 API conectada";
                indicador.style.color = "#155724";
            } else {
                indicador.textContent = "🔴 API con errores (HTTP " + res.status + ")";
                indicador.style.color = "#721c24";
            }
        } catch {
            indicador.textContent = "🔴 API sin conexión — modo offline";
            indicador.style.color = "#856404";
        }
    }
    verificarAPI();

    async function iniciarSesion() {
        const correo   = document.getElementById("login-correo").value.trim();
        const password = document.getElementById("login-password").value;

        if (!correo || !password) {
            mostrarMensaje("Por favor ingresa tu correo y contraseña.", "error"); return;
        }

        const ahora = new Date();
        const fechaHoraLogin = ahora.toLocaleDateString("es-CO") + " " +
            ahora.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });

        let usuarioFinal = null;

        try {
            // 1. Intentar login por endpoint dedicado
            const resLogin = await fetch(API_LOGIN, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ correo, contraseña: password }),
                signal: AbortSignal.timeout(4000)
            });

            if (resLogin.ok) {
                const u = await resLogin.json();
                usuarioFinal = {
                    id: u.id, nombre: u.nombre, correo: u.correo,
                    rol: u.rol || "Empleado", ultimoLogin: fechaHoraLogin
                };
            } else {
                // 2. Fallback: obtener lista y buscar por correo
                const resList = await fetch(API_USUARIOS, { signal: AbortSignal.timeout(4000) });
                if (resList.ok) {
                    const lista = await resList.json();
                    const encontrado = lista.find(u =>
                        u.correo?.toLowerCase() === correo.toLowerCase()
                    );
                    if (!encontrado) {
                        mostrarMensaje("Correo no encontrado. ¿Ya estás registrado?", "error"); return;
                    }
                    usuarioFinal = {
                        id: encontrado.id, nombre: encontrado.nombre, correo: encontrado.correo,
                        rol: encontrado.rol || "Empleado", ultimoLogin: fechaHoraLogin
                    };
                } else throw new Error("API no disponible");
            }
        } catch {
            // 3. Modo offline: buscar en localStorage
            const locales = JSON.parse(localStorage.getItem("usuariosLocales") || "[]");
            const encontrado = locales.find(u =>
                u.correo?.toLowerCase() === correo.toLowerCase()
            );
            usuarioFinal = encontrado
                ? { ...encontrado, ultimoLogin: fechaHoraLogin }
                : { id: 0, nombre: "Usuario", correo, rol: "Empleado", ultimoLogin: fechaHoraLogin };
        }

        sessionStorage.setItem("usuarioLogueado", JSON.stringify(usuarioFinal));

        // Actualizar ultimoLogin en localStorage
        const locales = JSON.parse(localStorage.getItem("usuariosLocales") || "[]");
        const idx = locales.findIndex(u => u.correo === correo);
        if (idx !== -1) {
            locales[idx].ultimoLogin = fechaHoraLogin;
        } else {
            locales.push({
                id: usuarioFinal.id || Date.now(), nombre: usuarioFinal.nombre,
                correo: usuarioFinal.correo, edad: usuarioFinal.edad || "-", rol: usuarioFinal.rol,
                contraseña: password,
                estado: true, fechaRegistro: ahora.toLocaleDateString("es-CO"),
                ultimoLogin: fechaHoraLogin
            });
        }
        localStorage.setItem("usuariosLocales", JSON.stringify(locales));

        mostrarMensaje("¡Bienvenido! Redirigiendo...", "ok");
        setTimeout(() => window.location.href = "dashboard.html", 1000);
    }
</script>
</body>
</html>
